<style>
  /* Экран продукта в приложении Альфы: серый фон, белые группы со скруглением 24,
     ячейки списка с разделителями. Токены — core-ds/core-components (bluetint, superapp),
     шапка и заглушка — как в 8094 и 8240. */
  :root{
    --page:#f2f3f5;                                /* bg-secondary — фон экрана */
    --surface:#ffffff;                             /* группы */
    --fill:#f2f3f5;                                /* плашки внутри группы */
    --fill-2:#e7e8ea;                              /* bg-tertiary */
    --tint:rgba(38,55,88,.06);                     /* neutral-translucent-100 */
    --tint-3:rgba(15,25,55,.1);                    /* neutral-translucent-300 */
    --text:rgba(3,3,6,.88);                        /* text-primary */
    --text-2:rgba(4,4,19,.55);                     /* text-secondary */
    --text-3:rgba(5,8,29,.38);                     /* text-tertiary */
    --graphite:#212124;                            /* accent-secondary: основная кнопка, выбор */
    --line:#e7e8ec;                                /* border-secondary */
    --line-2:#d5d6dc;                              /* border-primary */
    --red:#ef3124;                                 /* accent-primary: только бренд */
    --pos:#0cc44d; --pos-bg:#dff8e5;
    --neg:#ff4837; --neg-bg:#ffebeb;
    --font:system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Helvetica, sans-serif;
    --font-head:"Styrene UI", system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Helvetica, sans-serif;
    color-scheme:light;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--page); color:var(--text); }
  body{ font-family:var(--font); font-size:16px; line-height:24px; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  body.white, body.white .header{ background:var(--surface); }
  button{ font-family:inherit; color:inherit; }
  ul,ol{ list-style:none; margin:0; padding:0; }
  [hidden]{ display:none !important; }

  /* ── шапка ── */
  .header{ position:sticky; top:0; z-index:6; display:flex; align-items:center; justify-content:center;
           padding:calc(env(safe-area-inset-top) + 6px) 48px 10px; background:var(--page); }
  .header .back{ position:absolute; left:8px; bottom:6px; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
                 border:0; background:transparent; cursor:pointer; border-radius:50%; }
  .header .title{ font-size:17px; line-height:22px; font-weight:600; }
  .screen{ max-width:480px; margin:0 auto; padding:4px 12px calc(env(safe-area-inset-bottom) + 128px); }

  /* ── типографика: шкала headline-mobile, вес 500 ── */
  h1{ font-family:var(--font-head); font-size:30px; line-height:36px; font-weight:500; letter-spacing:-.01em; margin:0 0 10px; text-wrap:balance; }
  h2{ font-family:var(--font-head); font-size:20px; line-height:28px; font-weight:500; margin:0 0 12px; text-wrap:balance; }
  .screen-title{ font-size:26px; line-height:32px; margin:0 4px 8px; }
  .sub{ font-size:16px; line-height:24px; color:var(--text-2); margin:0 0 16px; }
  .micro{ font-size:13px; line-height:16px; color:var(--text-3); text-align:center; margin:10px 0 0; }
  .eyebrow{ display:flex; align-items:center; gap:8px; font-size:14px; line-height:20px; color:var(--text-2); margin:0 0 8px; }
  .badge{ font-size:11px; line-height:16px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; color:var(--red); background:#feeceb; border-radius:6px; padding:1px 6px; }

  /* ── группы ── */
  .group{ background:var(--surface); border-radius:24px; padding:20px 16px; margin:0 0 12px; }
  .hero{ padding:8px 8px 16px; }
  .hero-text{ padding:16px 8px 4px; }
  .hero .btn{ margin:12px 0 0; }

  /* ── кнопки: основная — графит, радиус 16, высота 56 ── */
  .btn{ display:flex; align-items:center; justify-content:center; width:100%; min-height:56px; border:0; border-radius:16px; padding:0 20px;
        font-size:16px; line-height:24px; font-weight:500; background:var(--graphite); color:#fff; cursor:pointer; }
  .btn:active{ opacity:.85; }
  .btn:disabled{ background:var(--fill-2); color:var(--text-3); cursor:default; opacity:1; }
  .btn.ghost{ background:transparent; color:var(--text); min-height:48px; }
  .btn:focus-visible,.opt:focus-visible,.faq summary:focus-visible,.header .back:focus-visible{ outline:2px solid var(--graphite); outline-offset:2px; }
  .sticky{ position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
           background:var(--surface); box-shadow:0 -1px 0 var(--line); transform:translateY(110%); transition:transform .25s; z-index:5; }
  .sticky.on{ transform:none; }
  .sticky .btn{ max-width:456px; margin:0 auto; }
  @media (prefers-reduced-motion: reduce){ .sticky{ transition:none; } }

  /* ── чипы под подзаголовком: строки с галочкой, без «таблеток» ── */
  .tags{ display:flex; flex-direction:column; gap:6px; margin:0 0 4px; }
  .tags li{ position:relative; padding-left:24px; font-size:15px; line-height:20px; }
  .tags li::before{ content:""; position:absolute; left:3px; top:4px; width:10px; height:6px; border-left:2px solid var(--graphite); border-bottom:2px solid var(--graphite); transform:rotate(-45deg); }

  /* ── сцена hero: светло-серая подложка, на ней карта и детали сценария ── */
  .stage{ background:var(--fill); border-radius:20px; padding:20px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; overflow:hidden; }
  .card{ width:100%; max-width:264px; aspect-ratio:1.586; border-radius:16px; padding:14px 16px; background:var(--red); color:#fff;
         display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .card .card-top, .card .card-bottom{ display:flex; justify-content:space-between; align-items:flex-start; }
  .card .logo svg{ width:18px; height:23px; display:block; }
  .card .card-kind{ font-size:12px; line-height:16px; opacity:.85; }
  .card .num{ font-size:14px; letter-spacing:.06em; font-variant-numeric:tabular-nums; }
  .card.muted{ background:#c9cad0; color:#fff; }
  .card.small{ max-width:none; padding:10px 12px; border-radius:12px; }
  .card.small .logo svg{ width:14px; height:18px; }
  .card.small .num{ font-size:11px; letter-spacing:0; }
  .card .num{ white-space:nowrap; }
  .card .card-bottom{ align-items:flex-end; gap:6px; }
  .stage-chart .card.small, .stage-feed .card{ max-width:240px; }
  .stage-chart .card.small{ max-width:132px; align-self:flex-start; }
  .stack{ width:100%; display:flex; flex-direction:column; gap:6px; }

  /* пуш банка */
  .push{ display:flex; gap:10px; align-items:flex-start; width:100%; background:rgba(255,255,255,.92); border-radius:16px; padding:10px 12px;
         box-shadow:0 1px 2px rgba(0,0,0,.05); text-align:left; }
  .group .push{ background:var(--fill); box-shadow:none; }
  .stage .push{ background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .app-icon{ flex:0 0 32px; height:32px; border-radius:8px; background:var(--red); color:#fff; display:grid; place-items:center; }
  .app-icon svg{ width:13px; height:17px; display:block; }
  .push-body{ min-width:0; flex:1; }
  .push-head{ display:flex; justify-content:space-between; gap:8px; font-size:13px; line-height:16px; }
  .push-head b{ font-weight:600; }
  .push-head span{ color:var(--text-3); }
  .push-text{ font-size:14px; line-height:20px; margin-top:2px; }
  /* иконка приложения всегда красная, статус — значком у времени */
  .push.ok .push-head span::before{ content:"✓ "; color:var(--pos); }
  .push.bad .push-head span::before{ content:"✕ "; color:var(--neg); }

  /* график цены */
  .chart{ width:100%; background:var(--surface); border-radius:16px; padding:12px 12px 10px; }
  .chart-head{ display:flex; justify-content:space-between; font-size:13px; line-height:16px; color:var(--text-2); margin-bottom:4px; }
  .chart-head b{ color:var(--text); font-weight:600; }
  .chart svg{ display:block; width:100%; height:auto; }
  .chart-foot{ font-size:13px; line-height:16px; font-weight:600; text-align:right; margin-top:2px; }

  /* две карты */
  .pair{ width:100%; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pair-col{ min-width:0; display:flex; flex-direction:column; gap:8px; }
  .owner{ display:flex; align-items:center; gap:6px; font-size:13px; line-height:16px; color:var(--text-2); }
  .owner svg{ width:14px; height:14px; flex:0 0 14px; }
  .rules{ display:flex; flex-direction:column; background:var(--surface); border-radius:12px; padding:2px 10px; }
  .rules li{ font-size:12px; line-height:16px; padding:7px 0; border-bottom:1px solid var(--line); }
  .rules li:last-child{ border-bottom:0; }

  /* счётчик кэшбэка */
  .counter{ width:100%; max-width:264px; background:var(--surface); border-radius:16px; padding:12px 14px; display:grid; gap:2px; }
  .counter span{ font-size:13px; line-height:16px; color:var(--text-2); }
  .counter b{ font-family:var(--font-head); font-size:26px; line-height:32px; font-weight:500; font-variant-numeric:tabular-nums; }
  .counter small{ font-size:12px; line-height:16px; color:var(--text-3); }

  /* ── как это работает: степпер с линией ── */
  .stepper li{ position:relative; display:grid; grid-template-columns:28px 1fr; gap:14px; padding-bottom:18px; }
  .stepper li:last-child{ padding-bottom:0; }
  .stepper li:not(:last-child)::before{ content:""; position:absolute; left:13px; top:30px; bottom:2px; width:2px; background:var(--line); }
  .stepper .n{ width:28px; height:28px; border-radius:50%; border:1.5px solid var(--graphite); font-size:14px; line-height:25px; text-align:center; font-weight:500; }
  .stepper b{ display:block; font-weight:500; line-height:22px; margin-top:2px; }
  .stepper p{ margin:2px 0 0; color:var(--text-2); font-size:14px; line-height:20px; }

  /* ── пример из жизни ── */
  .rule{ display:inline-block; font-size:13px; line-height:16px; color:var(--text-2); background:var(--fill); padding:6px 10px; border-radius:8px; margin-bottom:14px; }
  .thread{ display:flex; flex-direction:column; gap:8px; }
  .bubble{ max-width:86%; padding:10px 14px; border-radius:18px; font-size:15px; line-height:20px; }
  .bubble.user{ align-self:flex-end; background:var(--graphite); color:#fff; border-bottom-right-radius:6px; }
  .bubble.bot{ align-self:flex-start; background:var(--fill); border-bottom-left-radius:6px; }
  .bubble .who{ display:block; font-size:12px; line-height:16px; color:var(--text-3); margin-bottom:2px; }
  .confirm{ background:var(--fill); border-radius:16px; padding:12px; font-size:14px; line-height:20px; }
  .confirm .push-head{ margin-bottom:4px; }
  .confirm .acts{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; pointer-events:none; }
  .confirm .acts span{ text-align:center; padding:9px; border-radius:12px; font-weight:500; background:var(--surface); }
  .confirm .acts span:last-child{ background:var(--graphite); color:#fff; }
  .compare{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .compare div{ border-radius:16px; padding:12px; background:var(--fill); min-width:0; display:grid; gap:2px; }
  .compare div.hi{ background:var(--graphite); color:#fff; }
  .compare span{ font-size:12px; line-height:16px; color:var(--text-2); }
  .compare div.hi span, .compare div.hi small{ color:rgba(255,255,255,.7); }
  .compare b{ font-family:var(--font-head); font-size:20px; line-height:28px; font-weight:500; }
  .compare small{ font-size:13px; line-height:16px; color:var(--text-2); }
  .caption{ font-size:14px; line-height:20px; color:var(--text-2); margin:12px 0 0; }

  /* ── вы под контролем: ячейки списка ── */
  /* разделитель — только под текстом, от левого края текста, как в списках приложения */
  .cells li{ display:grid; grid-template-columns:40px 1fr; gap:12px; }
  .cells li > div{ padding:12px 0; min-width:0; }
  .cells li + li > div{ border-top:1px solid var(--line); }
  .cells .ico{ align-self:center; width:40px; height:40px; border-radius:50%; background:var(--fill); display:grid; place-items:center; color:var(--graphite); }
  .cells .ico svg{ width:20px; height:20px; display:block; }
  .cells b{ display:block; font-weight:500; line-height:22px; }
  .cells span:not(.ico){ display:block; font-size:14px; line-height:20px; color:var(--text-2); }

  /* ── FAQ ── */
  .faq + .faq{ border-top:1px solid var(--line); }
  .faq summary{ list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 0; font-weight:500; }
  .faq summary::-webkit-details-marker{ display:none; }
  .faq summary i{ color:var(--text-3); display:grid; transition:transform .2s; }
  .faq[open] summary i{ transform:rotate(180deg); }
  .faq p{ margin:0 0 14px; color:var(--text-2); font-size:14px; line-height:20px; }

  .footer{ font-size:12px; line-height:16px; color:var(--text-3); padding:4px 8px 0; }
  .footer p{ margin:0 0 6px; }

  /* ── конструктор ── */
  .progress{ display:flex; gap:4px; margin:4px 4px 16px; }
  .progress i{ flex:1; height:4px; border-radius:2px; background:var(--fill-2); }
  .progress i.on{ background:var(--graphite); }
  .stepno{ font-size:14px; line-height:20px; color:var(--text-2); margin:0 4px 4px; }
  .screen > .sub{ margin:0 4px 12px; }
  .list{ background:var(--surface); border-radius:24px; padding:4px 16px; margin:8px 0 12px; }
  .opt{ display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; text-align:left; border:0; background:transparent;
        padding:14px 0; font-size:16px; line-height:22px; cursor:pointer; min-height:56px; }
  .opt + .opt, .inline-amount + .opt{ border-top:1px solid var(--line); }
  .opt .mark{ flex:0 0 24px; height:24px; border-radius:7px; border:2px solid var(--line-2); display:grid; place-items:center; }
  .opt.radio .mark{ border-radius:50%; }
  .opt[aria-pressed="true"] .mark{ border-color:var(--graphite); background:var(--graphite); }
  .opt[aria-pressed="true"] .mark::after{ content:""; width:10px; height:6px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-1px) rotate(-45deg); }
  .opt.radio[aria-pressed="true"] .mark{ background:var(--surface); border-width:7px; }
  .opt.radio[aria-pressed="true"] .mark::after{ display:none; }
  .field{ width:100%; border:0; border-radius:16px; padding:16px; font-size:16px; line-height:24px; font-family:inherit; color:var(--text); background:var(--surface); }
  .list .field{ background:var(--fill); }
  .field::placeholder{ color:var(--text-3); }
  .field:focus{ outline:2px solid var(--graphite); }
  .inline-amount{ padding:0 0 12px; }
  .inline-amount .field{ padding:12px 14px; }
  .sliders{ padding:8px 16px; }
  .slider{ padding:14px 0; }
  .slider + .slider{ border-top:1px solid var(--line); }
  .slider label{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:10px; }
  .slider label span{ color:var(--text-2); font-size:15px; }
  .slider label b{ font-family:var(--font-head); font-size:20px; line-height:28px; font-weight:500; font-variant-numeric:tabular-nums; }
  .slider input{ width:100%; accent-color:var(--graphite); }
  .slider .ends{ display:flex; justify-content:space-between; font-size:12px; line-height:16px; color:var(--text-3); margin-top:4px; }
  .actions{ position:fixed; left:0; right:0; bottom:0; background:var(--surface); padding:10px 12px calc(env(safe-area-inset-bottom) + 6px);
            box-shadow:0 -1px 0 var(--line); z-index:5; }
  .actions .in{ max-width:456px; margin:0 auto; display:flex; flex-direction:column; gap:2px; }

  /* ── цена ── */
  .summary-card{ background:var(--surface); border-radius:24px; padding:16px; margin:8px 0 12px; display:grid; grid-template-columns:96px 1fr; gap:16px; align-items:start; }
  .summary-card .card{ max-width:96px; }
  .summary{ margin:0; display:grid; grid-template-columns:auto; gap:0; }
  .summary dt{ font-size:12px; line-height:16px; color:var(--text-3); }
  .summary dd{ margin:0 0 8px; font-size:15px; line-height:20px; font-weight:500; }
  .summary dd:last-child{ margin-bottom:0; }
  .price{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:16px 0; }
  .price span{ color:var(--text-2); }
  .price b{ font-weight:600; text-align:right; }

  /* ── финал: как экран-заглушка 8240 ── */
  .final-head{ text-align:center; min-height:calc(100dvh - 180px); display:flex; flex-direction:column; justify-content:center; padding:16px 8px; }
  .final-head .icon{ margin:0 auto 16px; width:96px; }
  .final-head h2{ font-size:22px; line-height:28px; margin:0 0 8px; }
  .final-head p{ margin:0 auto; max-width:320px; font-size:16px; line-height:22px; color:var(--text-2); }

</style>

    where = 'b' + st.n;
    backTo = function(){ if(i === 0) showLanding(); else goStep(i - 1); };
    once('page_view', { step: st.n }, 'step' + st.n);
    if(st.sliders) return renderSliders(st, i);
    var s = h('div', { class:'screen' }, head(st));
    var chosen = [], otherText = '', amount = '';
    var list = h('div', { class:'list' });
    var otherField = st.other ? h('input', { class:'field', id:'other-' + st.n, type:'text', maxlength:'200', placeholder:'Что ещё поручили бы помощнику?', hidden:'' }) : null;
    var amountRow = null, amountField = null;
    if(st.autonomy){
      amountField = h('input', { class:'field', id:'amount-4', type:'number', inputmode:'numeric', min:'0', step:'100', placeholder:'Сумма, ₽' });
      amountRow = h('div', { class:'inline-amount', hidden:'' }, [ amountField ]);
    }
    var act = actions('Дальше', function(){
      var val = chosen.slice();
      var payload = { step: st.n, value: val.join(' | ') };
      if(st.other && val.indexOf('Другое') >= 0){ otherText = otherField.value.trim(); payload.text = otherText; }
      if(st.autonomy && val[0] === st.opts[1]){ amount = amountField.value.trim(); payload.text = amount; payload.amount = amount; payload.value = st.opts[1].replace('___', amount || '…'); }
      answers[st.n] = { values: val, text: otherText, amount: amount };
      if(st.top && val.length === 1){ answers[st.n].top = val[0]; payload.top = val[0]; }
      once('click_continue', payload, 'step' + st.n);
      if(st.top && val.length >= 2) return renderTop(st, i, val);
      next(i);
    }, function(){
      answers[st.n] = { skipped:true };
      once('click_skip', { step: st.n }, 'step' + st.n);
      next(i);
    });
    act.btn.disabled = true;

    st.opts.forEach(function(label){
      var b = optButton(label.replace('___', '…'), !st.multi, false, function(){
        if(st.multi){
          var k = chosen.indexOf(label);
          if(k >= 0) chosen.splice(k,1); else chosen.push(label);
          b.setAttribute('aria-pressed', chosen.indexOf(label) >= 0 ? 'true' : 'false');
        } else {
          chosen = [label];
          Array.prototype.forEach.call(list.querySelectorAll('.opt'), function(o){ o.setAttribute('aria-pressed','false'); });
          b.setAttribute('aria-pressed','true');
        }
        if(otherField) otherField.hidden = chosen.indexOf('Другое') < 0;
        if(amountRow) amountRow.hidden = chosen[0] !== st.opts[1];
        act.btn.disabled = chosen.length === 0;
      });
      list.appendChild(b);
      if(st.autonomy && label === st.opts[1]) list.appendChild(amountRow);
    });
    s.appendChild(list);
    if(otherField) s.appendChild(otherField);
    s.appendChild(act.node);
    mount(s);
  }

  // «Что из этого важнее всего?» — один вариант среди выбранных.
  // Отдельного события в ГА нет — это продолжение шага 1, ответ пишем только в таблицу.
  function renderTop(st, i, val){
    backTo = function(){ goStep(i); };
    var s = h('div', { class:'screen' }, head(st, 'Что из этого важнее всего?'));
    var pick = null, list = h('div', { class:'list' });
    var act = actions('Дальше', function(){
      answers[st.n].top = pick;
      send('answer_top', { step: st.n, value: pick, top: pick }, 'step' + st.n, true);
      next(i);
    }, null);
    act.btn.disabled = true;
    val.forEach(function(label){
      var b = optButton(label, true, false, function(){
        pick = label;
        Array.prototype.forEach.call(list.querySelectorAll('.opt'), function(o){ o.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true'); act.btn.disabled = false;
      });
      list.appendChild(b);
    });
    s.appendChild(list); s.appendChild(act.node);
    mount(s);
  }

  function renderSliders(st, i){
    var monthly = 10000, single = 3000, moved = { m:false, s:false };
    var mOut = h('b', { text: rub(monthly) }), sOut = h('b', { text: rub(single) });
    var m = h('input', { type:'range', id:'slider-month', min:'1000', max:'50000', step:'500', value:String(monthly), 'aria-label':'Лимит в месяц' });
    var sg = h('input', { type:'range', id:'slider-single', min:'500', max:String(monthly), step:'500', value:String(single), 'aria-label':'Максимум на одну покупку' });
    var sEnd = h('span', { text: rub(monthly) });
    m.addEventListener('input', function(){
      monthly = +m.value; moved.m = true; mOut.textContent = rub(monthly);
      sg.max = String(monthly); sEnd.textContent = rub(monthly);
      if(single > monthly){ single = monthly; sg.value = String(single); sOut.textContent = rub(single); }
    });
    sg.addEventListener('input', function(){ single = +sg.value; moved.s = true; sOut.textContent = rub(single); });
    var s = h('div', { class:'screen' }, head(st).concat([
      h('div', { class:'list sliders' }, [
        h('div', { class:'slider' }, [ h('label', { for:'slider-month' }, [ h('span', { text:'Лимит в месяц' }), mOut ]), m,
                                       h('div', { class:'ends' }, [ h('span', { text: rub(1000) }), h('span', { text: rub(50000) }) ]) ]),
        h('div', { class:'slider' }, [ h('label', { for:'slider-single' }, [ h('span', { text:'Максимум на одну покупку' }), sOut ]), sg,
                                       h('div', { class:'ends' }, [ h('span', { text: rub(500) }), sEnd ]) ])
      ])
    ]));
    var act = actions('Дальше', function(){
      answers[3] = { monthly: monthly, single: single };
      // moved — двигал ли человек ползунки: значение по умолчанию тоже ответ, но более слабый
      once('click_continue', { step:3, value: monthly + ' / ' + single, monthly: monthly, single: single,
                               moved: (moved.m ? 'm' : '') + (moved.s ? 's' : '') || 'none' }, 'step3');
      next(i);
    }, function(){ answers[3] = { skipped:true }; once('click_skip', { step:3 }, 'step3'); next(i); });
    s.appendChild(act.node);
    mount(s);
  }

  function next(i){ if(i + 1 < STEPS.length) goStep(i + 1); else renderPrice(); }

  // ====== ЭКРАН ЦЕНЫ ======
  function short(s){ return s ? s.replace(' (встроенный в приложение)', '') : s; }
  function renderPrice(){
    where = 'price';
    backTo = function(){ goStep(STEPS.length - 1); };
    var a1 = answers[1] || {}, a2 = answers[2] || {}, a3 = answers[3] || {}, a4 = answers[4] || {};
    var scenario = a1.skipped ? 'Не выбрано' : (a1.top || (a1.values || [])[0] || 'Не выбрано');
    if(scenario === 'Другое' && a1.text) scenario = a1.text;
    var mode = a4.skipped || !a4.values ? 'Не выбран' :
      (a4.values[0] === STEPS[3].opts[1] ? 'Спрашивать, если дороже ' + (a4.amount ? rub(a4.amount) : 'заданной суммы') : a4.values[0]);
    var limit = a3.skipped || !a3.monthly ? 'Не задан' : rub(a3.monthly) + ' в месяц, до ' + rub(a3.single) + ' за покупку';
    var s = h('div', { class:'screen' }, [
      h('h2', { class:'screen-title', text:'Ваша Агентская карта' }),
      h('div', { class:'summary-card' }, [ card({ small:true }), h('dl', { class:'summary' }, [
        h('dt', { text:'Сценарий' }), h('dd', { text: scenario }),
        h('dt', { text:'Помощник' }), h('dd', { text: a2.skipped || !a2.values ? 'Не выбран' : short(a2.values[0]) }),
        h('dt', { text:'Лимит' }), h('dd', { text: limit }),
        h('dt', { text:'Режим' }), h('dd', { text: mode })
      ]) ]),
      h('div', { class:'list' }, [
        h('div', { class:'price' }, [ h('span', { text:'Обслуживание' }), h('b', { text: PRICE_TEXT }) ])
      ])
    ]);
    var act = actions('Получить ранний доступ', function(){
      if(!TEST_MODE) lsSet(K('done'), '1');   // тестовый проход не блокирует лендинг
      once('click_getaccess', { step:'price', value: PRICE_TEXT });
      renderFinal();
    }, null);
    s.appendChild(act.node);
    mount(s);
  }

  // ====== ФИНАЛ: раскрытие сразу после клика, как заглушка 8240 ======
  function renderFinal(revisit){
    where = 'final';
    backTo = null;
    sticky.hidden = true;
    once('end_page_view', { step:'final', value: revisit ? 'revisit' : 'submit' });
    mount(h('div', { class:'screen' }, [
      h('div', { class:'final-head' }, [
        h('div', { class:'icon', html:'<svg width="96" height="96" viewBox="0 0 96 96" fill="none" aria-hidden="true"><circle cx="48" cy="48" r="48" fill="#f2f3f5"/><path d="M33 30 H63 L48 48 Z" fill="#ef3124"/><path d="M33 66 H63 L48 48 Z" fill="#ef3124"/><path d="M31 30 H65 M31 66 H65" stroke="#ef3124" stroke-width="5" stroke-linecap="round"/></svg>' }),
        h('h2', { text:'Сервис еще в работе' }),
        h('p', { text:'Мы выбираем лучшие условия, чтобы вам точно понравилось. С нетерпением ждём, когда все заработает, чтобы показать вам' })
      ])
    ]), true);
  }

  // ====== НАЗАД ======
  // Кнопка в шапке ведет на предыдущий экран флоу, с лендинга и финала — из лендинга
  var backTo = null;
  function showLanding(){
    where = 'landing'; backTo = null;
    renderLanding();
    armLandingView();
  }

  // Просмотр лендинга засчитываем, когда страница пробыла на экране 1,5 секунды подряд или
  // человек начал с ней что-то делать. Сканеры ссылок открывают страницу и сразу закрывают.
  var landingSeen = false, seenTimer = null;
  function markLandingSeen(){
    if(landingSeen) return;
    landingSeen = true; clearTimeout(seenTimer);
    once('page_view_landing', { step:'landing' });
  }
  function armLandingView(){
    if(landingSeen) return;
    var start = function(){
      clearTimeout(seenTimer);
      if(document.visibilityState === 'visible') seenTimer = setTimeout(markLandingSeen, 1500);
    };
    document.addEventListener('visibilitychange', start);
    ['scroll','touchstart','pointerdown','keydown'].forEach(function(t){
      window.addEventListener(t, markLandingSeen, { passive:true, once:true });
    });
    start();
  }
  document.getElementById('backBtn').addEventListener('click', function(){
    if(backTo) backTo(); else history.back();
  });

  // ====== СТАРТ ======
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('[data-cta]');
    if(!b || where !== 'landing') return;
    markLandingSeen();
    maxScroll = Math.max(maxScroll, scrollDepth());
    once('click_continue', { step:'landing', value: b.getAttribute('data-cta'), scroll: maxScroll, faq: faqOpened.join(',') });
    window.removeEventListener('scroll', onLandingScroll);
    sticky.hidden = true; sticky.classList.remove('on');
    goStep(0);
  });

  // Прошедший флоу видит только финал
  if(!TEST_MODE && lsGet(K('done')) === '1'){ renderFinal(true); return; }
  showLanding();
})();
</script>
</body>
</html>
